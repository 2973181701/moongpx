name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: check / fmt / test / run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Show toolchain version
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Type check
        run: moon check

      - name: Format check
        run: moon fmt --check

      - name: Run tests
        run: moon test

      - name: Run runnable example
        run: moon run cmd/main
